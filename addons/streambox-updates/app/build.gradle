plugins { id 'com.android.application' }
android {
    namespace 'ca.techshop.streamboxupdates'
    compileSdk 34
    buildFeatures { aidl false }
    defaultConfig { applicationId 'ca.techshop.streamboxupdates'; minSdk 26; targetSdk 34; versionCode 5; versionName '1.4' }
    // The StreamBox release key, kept outside the repo. Updates only install over the same key, so every box needs this one.
    def releaseKey = new File(System.getProperty('user.home'), '.streambox/signing.properties')
    signingConfigs {
        if (releaseKey.isFile()) {
            def key = new Properties()
            releaseKey.withInputStream { key.load(it) }
            streambox {
                storeFile file(key.storeFile)
                storePassword key.storePassword
                keyAlias key.keyAlias
                keyPassword key.keyPassword
            }
        }
    }

    buildTypes { release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        signingConfig releaseKey.isFile() ? signingConfigs.streambox : signingConfigs.debug
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
