plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '3.5'
    }

    // The StreamBox release key, kept outside the repo. Updates only install over the same key, so every box needs this one.
    def releaseKey = new File(System.getProperty('user.home'), '.streambox/signing.properties')
    signingConfigs {
        if (releaseKey.isFile()) {
            def key = new Properties()
            releaseKey.withInputStream { key.load(it) }
            streambox {
                storeFile file(key.storeFile)
                storePassword key.storePassword
                keyAlias key.keyAlias
                keyPassword key.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without the release key, the debug key, so a build still works anywhere.
            signingConfig releaseKey.isFile() ? signingConfigs.streambox : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
